name: Trigger auto deployment for app-dewey-mcp

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/app-dewey-mcp-AutoDeployTrigger-ee413151-e45a-4f11-b61f-34e9eca54c9f.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APPDEWEYMCP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.APPDEWEYMCP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.APPDEWEYMCP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: deweymcpacaenvafa2db.azurecr.io
          registryUsername: ${{ secrets.APPDEWEYMCP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.APPDEWEYMCP_REGISTRY_PASSWORD }}
          containerAppName: app-dewey-mcp
          resourceGroup: dewey-mcp-aca-env
          imageToBuild: deweymcpacaenvafa2db.azurecr.io/app-dewey-mcp:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


